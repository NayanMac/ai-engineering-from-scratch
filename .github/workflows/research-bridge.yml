name: Research bridge

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-bridge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
      - name: Fetch the paperswithcode.co sitemaps and prune slugs that are gone
        id: refresh
        run: node scripts/research_bridge.js --refresh --prune --report "$RUNNER_TEMP/research-report.md"
      - name: Write the report to the job summary
        run: cat "$RUNNER_TEMP/research-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: The map still passes every check
        run: node scripts/research_bridge.js
      - name: Open a pull request when the map needs changes
        if: steps.refresh.outputs.mapping-changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: bot/research-bridge-refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add research/methods.json research/paperswithcode-index.json
          printf 'chore(research): drop slugs that left the paperswithcode.co sitemap\n' > "$RUNNER_TEMP/commit.txt"
          git commit -F "$RUNNER_TEMP/commit.txt"
          git push --force origin "HEAD:$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "an open pull request already tracks $BRANCH"
            exit 0
          fi
          printf '\nThis pull request was opened by the weekly research bridge job. A person must check it before merge. Close and reopen it to start the CI checks.\n' >> "$RUNNER_TEMP/research-report.md"
          gh pr create --base main --head "$BRANCH" --title "chore(research): drop slugs that left the paperswithcode.co sitemap" --body-file "$RUNNER_TEMP/research-report.md"
